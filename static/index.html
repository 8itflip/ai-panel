<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Panel</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main class="grid">
    <section class="card side">
      <div class="desk-brand"><b>AI Panel</b></div>
      <header class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
        <div class="headline" id="headline"></div>
      </header>

      <div class="tiles">
        <div class="tile" id="tile-waiting"><b>0</b><span data-i18n="tile.waiting"></span></div>
        <div class="tile" id="tile-working"><b>0</b><span data-i18n="tile.working"></span></div>
        <div class="tile" id="tile-done"><b>0</b><span data-i18n="tile.done"></span></div>
      </div>
      <div class="today" id="today"></div>

      <div id="meeting" hidden></div>

      <div class="cal">
        <h2 data-i18n="h.calendar"></h2>
        <ul id="events"></ul>
      </div>

      <div class="local"><ul id="local"></ul></div>

      <footer class="side-foot">
        <button id="theme" type="button" data-i18n-title="theme"></button>
        <span id="conn"></span>
      </footer>
    </section>

    <div class="desk-main">
      <section class="card col chats">
        <header class="col-head">
          <div class="col-title"><h1 data-i18n="desk.chats"></h1><span class="plan" id="chat-count"></span><span class="health"></span></div>
        </header>
        <div class="banner" id="chat-error" role="status"></div>
        <ul class="sessions"></ul>
        <div class="col-foot"></div>
      </section>
    </div>

    <aside class="desk-right">
      <section class="card subscriptions">
        <div class="section-heading subscriptions-heading"><h2 data-i18n="desk.subscriptions"></h2><div id="subscription-total"></div><span class="section-note" data-i18n="desk.remaining"></span></div>
        <div id="subscriptions"></div>
      </section>
      <section class="card attention">
        <div class="prs">
          <h2><span data-i18n="h.prs"></span> <span id="pr-count"></span></h2>
          <ul id="prs"></ul>
        </div>
      </section>
      <section class="card attention">
        <div class="prs pipelines">
          <h2><span data-i18n="h.pipelines"></span> <span id="pipeline-count"></span></h2>
          <ul id="pipelines"></ul>
        </div>
      </section>
    </aside>
  </main>
  <script src="i18n.js"></script>
  <script src="costs.js"></script>
  <script src="app.js"></script>
</body>
</html>
