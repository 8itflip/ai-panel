<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Panel</title>
  <link rel="stylesheet" href="style.css">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <main class="grid">
    <section class="card side">
      <header class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
        <div class="headline" id="headline"></div>
      </header>

      <div class="tiles">
        <div class="tile" id="tile-waiting"><b>0</b><span data-i18n="tile.waiting"></span></div>
        <div class="tile" id="tile-working"><b>0</b><span data-i18n="tile.working"></span></div>
        <div class="tile" id="tile-done"><b>0</b><span data-i18n="tile.done"></span></div>
      </div>
      <div class="today" id="today"></div>

      <div id="meeting" hidden></div>

      <div class="cal">
        <h2 data-i18n="h.calendar"></h2>
        <ul id="events"></ul>
      </div>

      <div class="prs">
        <h2><span data-i18n="h.prs"></span> <span id="pr-count"></span></h2>
        <ul id="prs"></ul>
      </div>

      <div class="local"><ul id="local"></ul></div>

      <footer class="side-foot">
        <button id="theme" type="button" data-i18n-title="theme"></button>
        <span id="conn"></span>
      </footer>
    </section>

    <section class="card col" data-tool="claude">
      <header class="col-head">
        <div class="col-title">
          <span class="glyph claude" aria-hidden="true">✳</span>
          <h1 data-name="Claude">Claude</h1>
          <span class="plan"></span>
          <span class="svc"></span>
          <span class="health"></span>
          <div class="money"><span class="cost"></span><span class="spend"></span></div>
        </div>
        <div class="bars"></div>
        <div class="accts"></div>
      </header>
      <div class="banner"></div>
      <ul class="sessions"></ul>
      <div class="col-foot"></div>
    </section>

    <section class="card col" data-tool="codex">
      <header class="col-head">
        <div class="col-title">
          <span class="glyph codex" aria-hidden="true">&gt;_</span>
          <h1 data-name="Codex">Codex</h1>
          <span class="plan"></span>
          <span class="svc"></span>
          <span class="health"></span>
          <div class="money"><span class="cost"></span><span class="spend"></span></div>
        </div>
        <div class="bars"></div>
        <div class="accts"></div>
      </header>
      <div class="banner"></div>
      <ul class="sessions"></ul>
      <div class="col-foot"></div>
    </section>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
