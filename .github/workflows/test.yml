name: Tests

# Run only for code changes on main and in pull requests; documentation and screenshots do not need it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore", "config.example.json"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore", "config.example.json"]

# A newer push makes the run for the previous one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # macOS: the panel is macOS-only (EventKit, WebKit, launchd) and the runner image includes Chrome
    # for the UI smoke test.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Server and UI tests
        run: python3 -m unittest discover -s tests -v

      - name: Translation tests
        run: node --test tests/i18n.test.mjs

      - name: JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done

      - name: Swift builds
        run: ./calendar/build.sh && ./kiosk/build.sh
